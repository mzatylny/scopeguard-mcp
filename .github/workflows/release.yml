name: Release evidence

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Build verified distributions and SBOM
        run: |
          python -m pip install build twine cyclonedx-bom
          python -m build
          twine check dist/*
          cyclonedx-py environment --output-format JSON --output-file dist/sbom.cdx.json

      - name: Attest release artifacts
        uses: actions/attest@v4
        with:
          subject-path: "dist/*"

      - name: Upload immutable release evidence
        uses: actions/upload-artifact@v7
        with:
          name: scopeguard-${{ github.ref_name }}
          path: dist/*
          if-no-files-found: error
