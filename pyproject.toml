[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "scopeguard-mcp"
version = "1.0.0"
description = "Policy-first defensive security operations server for MCP"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mateusz Marek Zatylny" }]
keywords = ["mcp", "security", "defensive-security", "sast", "audit"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]
dependencies = ["mcp>=2.0,<3"]

[project.urls]
Homepage = "https://github.com/mzatylny/scopeguard-mcp"
Repository = "https://github.com/mzatylny/scopeguard-mcp"
Issues = "https://github.com/mzatylny/scopeguard-mcp/issues"

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "bandit[toml]>=1.8,<2",
  "mypy>=1.14,<2",
  "pip-audit>=2.7,<3",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.16,<1",
  "twine>=6,<7",
]

[project.scripts]
scopeguard = "scopeguard_mcp.cli:main"
scopeguard-mcp = "scopeguard_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/scopeguard_mcp"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --cov=scopeguard_mcp --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
show_error_codes = true
exclude = ["tests/"]

[[tool.mypy.overrides]]
module = ["mcp.*"]
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests"]
