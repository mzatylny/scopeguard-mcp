[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "scopeguard-mcp"
version = "0.1.0"
description = "Policy-first defensive security operations server for MCP"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ScopeGuard contributors" }]
keywords = ["mcp", "security", "defensive-security", "sast", "audit"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
]
dependencies = ["mcp>=2.0,<3"]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<8",
  "ruff>=0.16,<1",
]

[project.scripts]
scopeguard = "scopeguard_mcp.cli:main"
scopeguard-mcp = "scopeguard_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/scopeguard_mcp"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --cov=scopeguard_mcp --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
